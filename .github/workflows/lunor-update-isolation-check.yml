name: LUNOR update isolation check

on:
  push:
    branches:
      - lunor/1.0-branding
    paths:
      - .github/workflows/lunor-update-isolation-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate isolated update/channel changes
        shell: bash
        run: |
          set -euo pipefail

          scripts=(
            bin/omarchy-update
            bin/omarchy-channel-current
            bin/omarchy-channel-set
            bin/omarchy-version-channel
            bin/omarchy-update-dev
            bin/omarchy-update-keyring
            bin/omarchy-refresh-pacman
          )

          for f in "${scripts[@]}"; do
            bash -n "$f"
          done

          scoped=(
            "${scripts[@]}"
            default/pacman/pacman-stable.conf
            default/pacman/pacman-rc.conf
            default/pacman/pacman-edge.conf
            default/pacman/mirrorlist-stable
            default/pacman/mirrorlist-rc
            default/pacman/mirrorlist-edge
          )

          if grep -Eni 'omarchy\.org|github\.com/omacom/omarchy|stable-mirror\.omarchy\.org|rc-mirror\.omarchy\.org|mirror\.omarchy\.org|pkgs\.omarchy\.org' "${scoped[@]}"; then
            echo "Upstream network reference still exists in scoped update files." >&2
            exit 1
          fi

          for f in default/pacman/pacman-{stable,rc,edge}.conf; do
            ! grep -Eq '^\[omarchy\]|pkgs\.omarchy\.org' "$f"
            grep -q '^\[core\]$' "$f"
            grep -q '^\[extra\]$' "$f"
          done

          for f in default/pacman/mirrorlist-{stable,rc,edge}; do
            grep -Fq 'https://geo.mirror.pkgbuild.com/$repo/os/$arch' "$f"
          done

          grep -q '^echo "local"$' bin/omarchy-channel-current
          grep -q '^echo "local / arch"$' bin/omarchy-version-channel
