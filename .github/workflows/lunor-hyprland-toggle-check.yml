name: LUNOR Hyprland toggle primitives check

on:
  push:
    branches:
      - lunor/1.0-branding
    paths:
      - .github/workflows/lunor-hyprland-toggle-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Hyprland toggle primitives
        shell: bash
        run: |
          set -euo pipefail

          for script in \
            bin/lunor-hyprland-toggle \
            bin/lunor-hyprland-toggle-enabled; do
            test -x "$script"
            bash -n "$script"
          done

          ./bin/lunor commands --check

          ./bin/lunor commands --all --json |
            jq -e '
              [.commands[]
               | select(.binary == "lunor-hyprland-toggle"
                     or .binary == "lunor-hyprland-toggle-enabled")]
              | length == 2
            ' >/dev/null

          ./bin/lunor hyprland toggle --help |
            grep -Fq 'lunor hyprland toggle <flag-name> [on|off|toggle]'
          ./bin/lunor hyprland toggle enabled --help |
            grep -Fq 'lunor hyprland toggle enabled <flag-name>'

          ./bin/omarchy hyprland toggle --help |
            grep -Fq 'omarchy hyprland toggle <flag-name> [on|off|toggle]'
          ./bin/omarchy hyprland toggle enabled --help |
            grep -Fq 'omarchy hyprland toggle enabled <flag-name>'

          grep -Fq 'FLAG_SOURCE="$LUNOR_PATH/default/hypr/toggles/$FLAG_NAME.lua"' bin/lunor-hyprland-toggle
          if grep -Fq 'OMARCHY_PATH' bin/lunor-hyprland-toggle; then
            echo "canonical Hyprland toggle still depends on OMARCHY_PATH" >&2
            exit 1
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/root/default/hypr/toggles" "$tmp/bin"
          printf 'return "demo"\n' >"$tmp/root/default/hypr/toggles/demo.lua"

          cat >"$tmp/bin/hyprctl" <<'SH'
          #!/bin/bash
          printf '%s\n' "$*" >>"$HYPRCTL_TEST_LOG"
          exit 0
          SH
          chmod +x "$tmp/bin/hyprctl"

          home="$tmp/home"
          log="$tmp/hyprctl.log"

          test "$(HOME="$home" LUNOR_PATH="$tmp/root" HYPRCTL_TEST_LOG="$log" PATH="$tmp/bin:$PATH" ./bin/lunor hyprland toggle demo)" = "on"
          cmp "$tmp/root/default/hypr/toggles/demo.lua" "$home/.local/state/lunor/toggles/hypr/demo.lua"
          HOME="$home" ./bin/lunor hyprland toggle enabled demo

          test "$(HOME="$home" LUNOR_PATH="$tmp/root" HYPRCTL_TEST_LOG="$log" PATH="$tmp/bin:$PATH" ./bin/lunor hyprland toggle demo)" = "off"
          if HOME="$home" ./bin/lunor hyprland toggle enabled demo; then
            echo "removed flag unexpectedly reported enabled" >&2
            exit 1
          fi

          test "$(grep -c '^reload$' "$log")" -eq 2
