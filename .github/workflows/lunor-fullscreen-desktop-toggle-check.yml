name: LUNOR fullscreen desktop toggle check

on:
  push:
    branches:
      - lunor/1.0-branding
    paths:
      - .github/workflows/lunor-fullscreen-desktop-toggle-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate fullscreen desktop toggle migration
        shell: bash
        run: |
          set -euo pipefail

          test -x bin/lunor-toggle-fullscreen-desktop
          bash -n bin/lunor-toggle-fullscreen-desktop
          ./bin/lunor commands --check

          ./bin/lunor commands --all --json |
            jq -e '
              .commands[]
              | select(.binary == "lunor-toggle-fullscreen-desktop"
                    and .route == "lunor toggle fullscreen desktop"
                    and .filename_route == "lunor toggle fullscreen desktop")
            ' >/dev/null

          ./bin/lunor toggle fullscreen desktop --help |
            grep -Fq 'lunor toggle fullscreen desktop [toggle|on|off]'

          ./bin/omarchy toggle fullscreen desktop --help |
            grep -Fq 'omarchy toggle fullscreen desktop [toggle|on|off]'

          if grep -Eq 'omarchy-(toggle-enabled|hyprland-toggle-enabled|toggle-bar|hyprland-toggle)' bin/lunor-toggle-fullscreen-desktop; then
            echo "canonical fullscreen desktop toggle still calls legacy Omarchy binaries directly" >&2
            exit 1
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          cat >"$tmp/lunor" <<'SH'
          #!/bin/bash
          printf '%s\n' "$*" >>"$LUNOR_TEST_LOG"
          case "$*" in
            "toggle enabled bar-off")
              [[ ${LUNOR_TEST_BAR_OFF:-0} == "1" ]]
              ;;
            "hyprland toggle enabled window-no-gaps")
              [[ ${LUNOR_TEST_NO_GAPS:-0} == "1" ]]
              ;;
            *)
              exit 0
              ;;
          esac
          SH
          chmod +x "$tmp/lunor"

          log="$tmp/calls"

          LUNOR_TEST_LOG="$log" LUNOR_TEST_BAR_OFF=1 LUNOR_TEST_NO_GAPS=1 PATH="$tmp:$PATH" ./bin/lunor-toggle-fullscreen-desktop
          grep -Fxq 'toggle bar off' "$log"
          grep -Fxq 'hyprland toggle window-no-gaps off' "$log"

          : >"$log"
          LUNOR_TEST_LOG="$log" LUNOR_TEST_BAR_OFF=1 LUNOR_TEST_NO_GAPS=0 PATH="$tmp:$PATH" ./bin/lunor-toggle-fullscreen-desktop
          grep -Fxq 'toggle bar on' "$log"
          grep -Fxq 'hyprland toggle window-no-gaps on' "$log"

          : >"$log"
          LUNOR_TEST_LOG="$log" PATH="$tmp:$PATH" ./bin/lunor-toggle-fullscreen-desktop off
          grep -Fxq 'toggle bar off' "$log"
          grep -Fxq 'hyprland toggle window-no-gaps off' "$log"

          : >"$log"
          LUNOR_TEST_LOG="$log" PATH="$tmp:$PATH" ./bin/lunor-toggle-fullscreen-desktop on
          grep -Fxq 'toggle bar on' "$log"
          grep -Fxq 'hyprland toggle window-no-gaps on' "$log"
