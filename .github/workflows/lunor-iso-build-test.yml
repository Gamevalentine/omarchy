name: LUNOR ISO build and VM test

on:
  push:
    branches:
      - lunor/1.0-clean-branding
    paths:
      - .github/workflows/lunor-iso-build-test.yml
      - test/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout LUNOR source
        uses: actions/checkout@v5
        with:
          path: lunor-source

      - name: Check runner resources
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          free -h
          test -e /dev/kvm
          avail_gb=$(df -BG --output=avail / | tail -1 | tr -dc 0-9)
          [ "$avail_gb" -ge 45 ] || {
            echo "::error::Only ${avail_gb} GB free; LUNOR ISO build + VM test needs about 45 GB."
            exit 1
          }

      - name: Fetch upstream ISO builder and package recipes
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch quattro https://github.com/omacom/omarchy-iso.git lunor-iso
          git clone --depth 1 https://github.com/omacom/omarchy-pkgs.git lunor-pkgs

      - name: Apply LUNOR ISO branding overlay
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          iso = Path("lunor-iso")
          pkgs = Path("lunor-pkgs")

          # ISO metadata visible in firmware/boot menus and mounted media.
          p = iso / "configs/profiledef.sh"
          s = p.read_text()
          s = s.replace('iso_name="omarchy"', 'iso_name="lunor-os"')
          s = s.replace('iso_label="OMARCHY_', 'iso_label="LUNOR_')
          s = s.replace('iso_publisher="Omarchy <https://omarchy.org>"',
                        'iso_publisher="LUNOR OS <https://github.com/Gamevalentine/omarchy>"')
          s = s.replace('iso_application="Omarchy Installer"',
                        'iso_application="LUNOR OS Installer"')
          p.write_text(s)

          # Boot menu / installer UI surfaces. Internal lowercase identifiers and
          # OMARCHY_* compatibility variables are deliberately untouched.
          ui_files = [
              "configs/airootfs/root/configurator",
              "configs/airootfs/usr/local/bin/omarchy-install-dashboard",
              "configs/airootfs/root/.automated_script.sh",
              "configs/airootfs/usr/share/omarchy-iso/orchestrator/main.py",
              "configs/airootfs/usr/share/omarchy-iso/orchestrator/phases_impl.py",
              "configs/grub/grub.cfg",
              "configs/grub/loopback.cfg",
              "configs/syslinux/archiso_head.cfg",
              "configs/syslinux/archiso_pxe-linux.cfg",
              "configs/syslinux/archiso_sys-linux.cfg",
              "configs/efiboot/loader/entries/01-archiso-x86_64-linux.conf",
          ]
          for rel in ui_files:
              p = iso / rel
              s = p.read_text()
              s = s.replace("Beautiful, Fun & Agentic Linux by DHH", "Welcome to LUNOR OS")
              s = s.replace("Omarchy", "LUNOR OS")
              p.write_text(s)

          # The installer should never seed the upstream Omarchy Arch mirror into
          # a LUNOR install. Keep ordinary Arch mirrors only.
          p = iso / "configs/airootfs/root/configurator"
          s = p.read_text()
          s = s.replace('            {"url": "https://mirror.omarchy.org/\\$repo/os/\\$arch"},\n', '')
          p.write_text(s)

          # The installed /etc/os-release is generated by the settings PKGBUILD,
          # not by the runtime source tree, so brand the user-visible identity
          # while retaining ID=omarchy and LOGO=omarchy as compatibility IDs.
          p = pkgs / "pkgbuilds/omarchy-settings-dev/PKGBUILD"
          s = p.read_text()
          required = [
              'NAME="Omarchy"',
              'PRETTY_NAME="Omarchy"',
              'HOME_URL="https://omarchy.org/"',
              'DOCUMENTATION_URL="https://learn.omacom.io/2/the-omarchy-manual"',
              'SUPPORT_URL="https://discord.gg/tXFUdasqhY"',
              'BUG_REPORT_URL="https://github.com/basecamp/omarchy/issues"',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit(f"Upstream PKGBUILD changed; expected os-release fields missing: {missing}")
          s = s.replace('NAME="Omarchy"', 'NAME="LUNOR OS"')
          s = s.replace('PRETTY_NAME="Omarchy"', 'PRETTY_NAME="LUNOR OS"')
          s = s.replace('HOME_URL="https://omarchy.org/"',
                        'HOME_URL="https://github.com/Gamevalentine/omarchy"')
          s = s.replace('DOCUMENTATION_URL="https://learn.omacom.io/2/the-omarchy-manual"',
                        'DOCUMENTATION_URL="https://github.com/Gamevalentine/omarchy/blob/lunor/1.0-clean-branding/README.md"')
          s = s.replace('SUPPORT_URL="https://discord.gg/tXFUdasqhY"',
                        'SUPPORT_URL="https://github.com/Gamevalentine/omarchy/issues"')
          s = s.replace('BUG_REPORT_URL="https://github.com/basecamp/omarchy/issues"',
                        'BUG_REPORT_URL="https://github.com/Gamevalentine/omarchy/issues"')
          p.write_text(s)

          # Archinstall 4.5 removed the old offline= parameter from
          # Installer.sanity_check(). Adapt the upstream ISO builder at build time.
          p = iso / "configs/airootfs/usr/share/omarchy-iso/orchestrator/phases_impl.py"
          s = p.read_text()
          needle = "            offline=True,"
          if needle not in s:
              raise SystemExit("Upstream archinstall sanity_check call changed; review compatibility patch")
          p.write_text(s.replace(needle, "", 1))

          # Keep the interactive VM harness compatible with the current shell.
          # OverlayWindow surfaces remain mapped when hidden, so shortcut tests
          # must check whether a surface is on the overlay layer, not whether
          # the namespace still exists anywhere in Hyprland's layer tree.
          p = iso / "bin/omarchy-iso-test"
          s = p.read_text().replace("Linux by DHH", "LUNOR .S")
          layer_needle = r"[.. | objects | select(.namespace? == \$namespace)] | length > 0"
          layer_replacement = r'[.[].levels["3"][]? | select(.namespace? == \$namespace)] | length > 0'
          if layer_needle not in s:
              raise SystemExit("Upstream shortcut layer check changed; review VM harness compatibility patch")
          s = s.replace(layer_needle, layer_replacement, 1)
          p.write_text(s)
          PY

          # Fail before the expensive build if a normal installer/boot surface
          # still contains the upstream display name.
          ! grep -RIn -E 'MENU (TITLE|LABEL).*Omarchy|menuentry "Omarchy|title +Omarchy|Beautiful, Fun & Agentic Linux by DHH|Installed Omarchy|Omarchy installation stopped|install Omarchy|Install Omarchy'             lunor-iso/configs/grub             lunor-iso/configs/syslinux             lunor-iso/configs/efiboot             lunor-iso/configs/airootfs/root/configurator             lunor-iso/configs/airootfs/usr/local/bin/omarchy-install-dashboard

          grep -Fq 'iso_name="lunor-os"' lunor-iso/configs/profiledef.sh
          grep -Fq 'iso_application="LUNOR OS Installer"' lunor-iso/configs/profiledef.sh
          grep -Fq 'NAME="LUNOR OS"' lunor-pkgs/pkgbuilds/omarchy-settings-dev/PKGBUILD
          grep -Fq 'PRETTY_NAME="LUNOR OS"' lunor-pkgs/pkgbuilds/omarchy-settings-dev/PKGBUILD
          ! grep -Fq 'mirror.omarchy.org' lunor-iso/configs/airootfs/root/configurator

      - name: Build LUNOR OS ISO from this branch
        shell: bash
        run: |
          set -euo pipefail
          cd lunor-iso
          NO_BOOT_OFFER=1 ./bin/omarchy-iso-make --keep-pkg-cache             --local-source ../lunor-source ../lunor-pkgs
          ls -lh release/
          iso=$(ls -t release/*.iso | head -1)
          sha256sum "$iso" | tee "$iso.sha256"

      - name: VM install and acceptance test
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod 0666 /dev/kvm
          docker run --rm --device /dev/kvm             -v "$PWD:/w" -w /w/lunor-iso             archlinux:latest bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed                 qemu-system-x86 qemu-hw-display-virtio-gpu qemu-hw-display-virtio-vga qemu-img edk2-ovmf socat                 imagemagick tesseract tesseract-data-eng mtools dosfstools jq openssh openssl python curl ripgrep lua >/dev/null
              printf "#!/bin/sh\nexit 0\n" >/usr/local/bin/omarchy-pkg-add
              chmod 0755 /usr/local/bin/omarchy-pkg-add
              export OMARCHY_PATH=/w/lunor-source
              ./bin/omarchy-iso-test release/*.iso                 --sync-omarchy /w/lunor-source                 --no-preview --memory 8192 --timeout 2400
            '

      - name: Collect and inspect VM diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d lunor-iso/test-runs ]; then
            sudo chown -R "$(id -u):$(id -g)" lunor-iso/test-runs
          fi

          echo "=== VM serial tail ==="
          find lunor-iso/test-runs -type f -name '*serial.log' -print -exec tail -n 120 {} \; 2>/dev/null || true

          echo "=== Failure screenshot OCR ==="
          shot=$(find lunor-iso/test-runs -type f -name 'failure-*.png' | sort | tail -1 || true)
          if [ -n "$shot" ]; then
            docker run --rm -v "$PWD:/w" -w /w archlinux:latest bash -euo pipefail -c '
              pacman -Sy --noconfirm --needed tesseract tesseract-data-eng >/dev/null
              tesseract "$1" stdout --psm 6 2>/dev/null || true
            ' _ "/w/$shot"
          fi

          echo "=== Successful visual checkpoints ==="
          find lunor-iso/test-runs -type f -name 'success-*.png' | sort | sed -n '1,120p' || true

          identity=$(find lunor-iso/test-runs -type f -name 'lunor-identity.txt' | head -1 || true)
          [ -z "$identity" ] || cat "$identity"

      - name: Upload LUNOR ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lunor-os-iso-${{ github.run_number }}
          path: |
            lunor-iso/release/*.iso
            lunor-iso/release/*.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Upload VM QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lunor-os-vm-qa-${{ github.run_number }}
          path: |
            lunor-iso/test-runs/**/*.png
            lunor-iso/test-runs/**/*.txt
            lunor-iso/test-runs/**/*.json
            lunor-iso/test-runs/**/*.log
          retention-days: 7
          if-no-files-found: ignore
