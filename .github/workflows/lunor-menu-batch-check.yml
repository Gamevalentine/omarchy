name: LUNOR menu batch check

on:
  push:
    branches:
      - lunor/1.0-branding
    paths:
      - .github/workflows/lunor-menu-batch-check.yml

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Validate menu migration
        shell: bash
        run: |
          set -euo pipefail

          scripts=(
            bin/lunor-menu
            bin/lunor-menu-clipboard
            bin/lunor-menu-emoji
            bin/lunor-menu-emoji-insert
            bin/lunor-menu-file
            bin/lunor-menu-herdr-keybindings
            bin/lunor-menu-images
            bin/lunor-menu-input
            bin/lunor-menu-keybindings
            bin/lunor-menu-plugin
            bin/lunor-menu-select
            bin/lunor-menu-share
            bin/lunor-menu-timezone
            bin/lunor-menu-tmux-keybindings
          )

          for script in "${scripts[@]}"; do
            test -x "$script"
            bash -n "$script"
            if grep -Eq 'omarchy-[a-z0-9-]+' "$script"; then
              echo "$script still calls or exposes a legacy Omarchy binary directly" >&2
              exit 1
            fi
          done

          if grep -Fq 'OMARCHY_PATH' bin/lunor-menu-tmux-keybindings; then
            echo "canonical tmux keybindings menu still depends on OMARCHY_PATH" >&2
            exit 1
          fi

          bash -n test/cli
          ./bin/lunor commands --check
          ./test/cli

# rerun after help expectation fix
