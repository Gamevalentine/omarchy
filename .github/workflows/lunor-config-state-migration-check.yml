name: LUNOR config state migration check
# validation rerun after cleanup

on:
  push:
    branches:
      - lunor/1.0-branding
    paths:
      - .github/workflows/lunor-config-state-migration-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject old config and state roots outside compatibility shim
        shell: bash
        run: |
          set -euo pipefail

          if git grep -nF '.config/omarchy' -- . \
            ':!install/user/lunor-paths.sh' \
            ':!.github/workflows/lunor-config-state-migration-check.yml'; then
            echo "Old user config root remains outside compatibility shim." >&2
            exit 1
          fi

          if git grep -nF '.local/state/omarchy' -- . \
            ':!install/user/lunor-paths.sh' \
            ':!.github/workflows/lunor-config-state-migration-check.yml'; then
            echo "Old user state root remains outside compatibility shim." >&2
            exit 1
          fi

          if git grep -nF '/etc/omarchy.conf' -- . \
            ':!bin/omarchy-dev-link' \
            ':!bin/omarchy-dev-unlink' \
            ':!.github/workflows/lunor-config-state-migration-check.yml'; then
            echo "Old system config path remains outside compatibility writers." >&2
            exit 1
          fi

      - name: Verify LUNOR roots are active
        shell: bash
        run: |
          set -euo pipefail
          git grep -nF '.config/lunor' -- bin default install etc shell >/dev/null
          git grep -nF '.local/state/lunor' -- bin default install etc shell >/dev/null
          git grep -nF '/etc/lunor.conf' -- bin install default etc >/dev/null

      - name: Test user namespace migration
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          export HOME="$tmp/home"
          mkdir -p "$HOME/.config/omarchy" "$HOME/.local/state/omarchy"
          printf 'legacy-config\n' > "$HOME/.config/omarchy/probe"
          printf 'legacy-state\n' > "$HOME/.local/state/omarchy/probe"

          bash install/user/lunor-paths.sh

          test -f "$HOME/.config/lunor/probe"
          test -f "$HOME/.local/state/lunor/probe"
          test -L "$HOME/.config/omarchy"
          test -L "$HOME/.local/state/omarchy"
          test "$(readlink -f "$HOME/.config/omarchy")" = "$HOME/.config/lunor"
          test "$(readlink -f "$HOME/.local/state/omarchy")" = "$HOME/.local/state/lunor"

          # Must be idempotent.
          bash install/user/lunor-paths.sh
          test -f "$HOME/.config/lunor/probe"
          test -f "$HOME/.local/state/lunor/probe"

      - name: Syntax-check touched runtime scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n install/user/lunor-paths.sh
          bash -n install/user/all.sh
          bash -n bin/omarchy-dev-link
          bash -n bin/omarchy-dev-unlink
          bash -n bin/omarchy-provision-user
