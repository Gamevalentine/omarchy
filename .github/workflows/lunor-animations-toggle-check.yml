name: LUNOR animations toggle check

on:
  push:
    branches:
      - lunor/1.0-branding
    paths:
      - .github/workflows/lunor-animations-toggle-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate animations toggle migration
        shell: bash
        run: |
          set -euo pipefail

          test -x bin/lunor-toggle-animations
          bash -n bin/lunor-toggle-animations
          ./bin/lunor commands --check

          ./bin/lunor commands --all --json |
            jq -e '
              .commands[]
              | select(.binary == "lunor-toggle-animations"
                    and .route == "lunor toggle animations"
                    and .filename_route == "lunor toggle animations")
            ' >/dev/null

          ./bin/lunor toggle animations --help |
            grep -Fq 'lunor toggle animations [toggle|on|off]'

          ./bin/omarchy toggle animations --help |
            grep -Fq 'omarchy toggle animations [toggle|on|off]'

          if grep -Eq 'omarchy-(hyprland-toggle|hyprland-toggle-enabled|notification-send)' bin/lunor-toggle-animations; then
            echo "canonical animations toggle still calls legacy Omarchy binaries" >&2
            exit 1
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          cat >"$tmp/lunor" <<'SH'
          #!/bin/bash
          printf '%s\n' "$*" >>"$LUNOR_TEST_LOG"
          if [[ $1 == "hyprland" && $2 == "toggle" && $3 == "enabled" ]]; then
            [[ ${LUNOR_TEST_ANIMATIONS_DISABLED:-0} == "1" ]]
            exit
          fi
          exit 0
          SH
          chmod +x "$tmp/lunor"

          log="$tmp/calls"

          LUNOR_TEST_LOG="$log" LUNOR_TEST_ANIMATIONS_DISABLED=1 PATH="$tmp:$PATH" ./bin/lunor-toggle-animations toggle
          grep -Fxq 'hyprland toggle no-animations toggle' "$log"
          grep -Fxq 'hyprland toggle enabled no-animations' "$log"
          grep -Fq 'notification send' "$log"
          grep -Fq 'Animations disabled' "$log"

          : >"$log"
          LUNOR_TEST_LOG="$log" LUNOR_TEST_ANIMATIONS_DISABLED=0 PATH="$tmp:$PATH" ./bin/lunor-toggle-animations on
          grep -Fxq 'hyprland toggle no-animations off' "$log"
          grep -Fq 'Animations enabled' "$log"

          : >"$log"
          LUNOR_TEST_LOG="$log" LUNOR_TEST_ANIMATIONS_DISABLED=1 PATH="$tmp:$PATH" ./bin/lunor-toggle-animations off
          grep -Fxq 'hyprland toggle no-animations on' "$log"
          grep -Fq 'Animations disabled' "$log"
