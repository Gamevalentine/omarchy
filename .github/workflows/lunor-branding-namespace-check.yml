name: LUNOR branding namespace check
# rerun after completing namespace migration

on:
  push:
    branches:
      - lunor/1.0-branding
    paths:
      - .github/workflows/lunor-branding-namespace-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify old branding namespace is gone
        shell: bash
        run: |
          set -euo pipefail

          old_patterns=(
            '.config/omarchy/branding'
            '.local/state/omarchy/windows/about.fit'
            'org.omarchy.about'
            'org.omarchy.screensaver'
          )

          failed=0
          for p in "${old_patterns[@]}"; do
            if git grep -nF "$p" -- . ':!.github/workflows/lunor-branding-namespace-check.yml'; then
              echo "Old branding namespace remains: $p" >&2
              failed=1
            fi
          done

          (( failed == 0 ))

      - name: Verify new branding namespace is wired
        shell: bash
        run: |
          set -euo pipefail
          git grep -nF '.config/lunor/branding' -- bin etc test manual >/dev/null
          git grep -nF 'org.lunor.about' -- bin test >/dev/null
          git grep -nF 'org.lunor.screensaver' -- bin test >/dev/null

      - name: Syntax-check changed runtime scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n bin/omarchy-branding-about
          bash -n bin/omarchy-branding-screensaver
          bash -n bin/omarchy-launch-about
          bash -n bin/omarchy-launch-screensaver
          bash -n bin/omarchy-screensaver
