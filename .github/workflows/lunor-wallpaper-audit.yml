name: LUNOR wallpaper audit

on:
  push:
    branches:
      - lunor/1.0-clean-branding
    paths:
      - .github/workflows/lunor-wallpaper-audit.yml

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install image reader
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pil
      - name: Print suspicious wallpaper previews
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageOps
          files = [
            "themes/flexoki-light/backgrounds/2-omarchy.webp",
            "themes/rose-pine/backgrounds/3-omarchy-plants.webp",
            "themes/tokyo-night/backgrounds/5-oma-cityscape.jpg",
            "themes/tokyo-night/backgrounds/6-oma.webp",
          ]
          chars = " .:-=+*#%@"
          tiny = [
            "themes/catppuccin-latte/backgrounds/omarchy.webp",
            "themes/catppuccin/backgrounds/omarchy.webp",
            "themes/ethereal/backgrounds/omarchy.webp",
            "themes/everforest/backgrounds/omarchy.webp",
            "themes/gruvbox/backgrounds/omarchy.webp",
            "themes/hackerman/backgrounds/omarchy.webp",
            "themes/kanagawa/backgrounds/omarchy.webp",
            "themes/lumon/backgrounds/omarchy.webp",
            "themes/lupine/backgrounds/06-omarchy.webp",
            "themes/matte-black/backgrounds/omarchy.webp",
            "themes/miasma/backgrounds/omarchy.webp",
            "themes/nord/backgrounds/omarchy.webp",
            "themes/osaka-jade/backgrounds/omarchy.webp",
            "themes/retro-82/backgrounds/omarchy.webp",
            "themes/ristretto/backgrounds/omarchy.webp",
            "themes/rose-pine/backgrounds/omarchy.webp",
            "themes/tokyo-night/backgrounds/omarchy.webp",
            "themes/vantablack/backgrounds/omarchy.webp",
            "themes/white/backgrounds/omarchy.webp",
          ]
          for path in tiny:
              src = Image.open(path).convert("RGB")
              colors = src.getcolors(maxcolors=1000000)
              print("TINY", path, "SIZE", src.size, "COLORS", len(colors) if colors is not None else ">1000000")
          for path in files:
              im = Image.open(path).convert("L")
              print("\n===", path, "===")
              print("SIZE", Image.open(path).size)
              thumb = ImageOps.autocontrast(im)
              thumb.thumbnail((72, 30))
              # compensate terminal character aspect
              thumb = thumb.resize((thumb.width, max(1, thumb.height//2)))
              pix = thumb.load()
              for y in range(thumb.height):
                  print("".join(chars[pix[x,y] * (len(chars)-1) // 255] for x in range(thumb.width)))
          PY
