name: LUNOR stage 5 validation

on:
  push:
    branches:
      - lunor/1.0-clean-branding
    paths:
      - .github/workflows/lunor-stage5-validation.yml

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate update isolation and documentation
        shell: bash
        run: |
          set -euo pipefail

          bash -n bin/omarchy-update
          bash -n bin/omarchy-update-available
          bash -n bin/omarchy-channel-set
          bash -n bin/omarchy-channel-current
          bash -n bin/omarchy-version-channel
          bash -n bin/omarchy-refresh-pacman
          bash -n bin/omarchy-update-pacman-guard

          set +e
          update_output=$(bin/omarchy-update 2>&1)
          update_status=$?
          available_output=$(bin/omarchy-update-available 2>&1)
          available_status=$?
          channel_output=$(bin/omarchy-channel-set stable 2>&1)
          channel_status=$?
          set -e

          [[ $update_status -eq 2 ]]
          [[ $available_status -eq 1 ]]
          [[ $channel_status -eq 2 ]]
          grep -Fq "LUNOR OS updates are intentionally disabled" <<<"$update_output"
          grep -Fq "LUNOR OS update service is not configured" <<<"$available_output"
          grep -Fq "package-channel switching is disabled" <<<"$channel_output"

          [[ $(bin/omarchy-channel-current) == development ]]
          [[ $(bin/omarchy-version-channel) == development ]]

          for conf in default/pacman/pacman-{stable,rc,edge}.conf; do
            ! grep -Eq '^\[omarchy\]$|pkgs\.omarchy\.org' "$conf"
            grep -Fq '[core]' "$conf"
            grep -Fq '[extra]' "$conf"
            grep -Fq '[multilib]' "$conf"
          done

          for mirror in default/pacman/mirrorlist-{stable,rc,edge}; do
            grep -Fq 'https://geo.mirror.pkgbuild.com/$repo/os/$arch' "$mirror"
            ! grep -Fq 'omarchy.org' "$mirror"
          done

          grep -Fq '# LUNOR OS' README.md
          grep -Fq '# Welcome to LUNOR OS!' manual/01-welcome-to-omarchy.md
          grep -Fq 'does **not** use the upstream Omarchy update service' manual/30-updates.md
          grep -Fq 'does **not** currently publish an independent ISO signing key' manual/48-security.md
          grep -Fq '"label":"Upstream Manual"' default/omarchy/omarchy-menu.jsonc
          grep -Fq '"label":"Upstream Community"' default/omarchy/omarchy-menu.jsonc
          grep -Fq '"label":"Channel","when":"false"' default/omarchy/omarchy-menu.jsonc
          grep -Fq 'Pending LUNOR OS Updates' shell/plugins/bar/widgets/SystemUpdate.qml
