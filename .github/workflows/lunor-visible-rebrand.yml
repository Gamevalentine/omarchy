name: LUNOR visible brand rename

on:
  push:
    branches:
      - lunor/1.0-branding
    paths:
      - .github/workflows/lunor-visible-rebrand.yml

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LUNOR branding branch
        uses: actions/checkout@v4
        with:
          ref: lunor/1.0-branding
          fetch-depth: 0

      - name: Replace visible Omarchy brand name with LUNOR OS
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(
            git grep -Ilz -e 'Omarchy' -- .               ':!LICENSE'               ':!.github/workflows/lunor-visible-rebrand.yml' || true
          )

          printf 'Replacing visible brand text in %s files\n' "${#files[@]}"

          for file in "${files[@]}"; do
            sed -i 's/Omarchy/LUNOR OS/g' "$file"
          done

          # Guardrail: this pass is branding text only. Internal lowercase
          # omarchy command names, paths, IDs and compatibility APIs stay intact.
          git diff --check

          echo "Changed files:"
          git diff --name-only

          echo "Remaining capitalized brand occurrences (LICENSE/workflow excluded):"
          git grep -In -e 'Omarchy' -- .             ':!LICENSE'             ':!.github/workflows/lunor-visible-rebrand.yml' || true

      - name: Commit visible branding rename
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No visible Omarchy branding left to replace."
            exit 0
          fi

          git config user.name "LUNOR Branding Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "LUNOR: replace visible Omarchy brand name"
          git push origin HEAD:lunor/1.0-branding
