name: LUNOR CLI entrypoint check

on:
  push:
    branches:
      - lunor/1.0-branding
    paths:
      - .github/workflows/lunor-cli-entrypoint-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical lunor command
        shell: bash
        run: |
          set -euo pipefail

          test -x bin/lunor
          test -x bin/omarchy
          bash -n bin/lunor
          bash -n bin/omarchy

          help="$(./bin/lunor --help)"
          printf '%s\n' "$help"
          grep -Fq 'LUNOR OS command center' <<<"$help"
          grep -Fq 'lunor <command> [args...]' <<<"$help"
          ! grep -Fq 'Usage: omarchy ' <<<"$help"

          ./bin/lunor commands --check

      - name: Keep legacy router functional for staged migration
        shell: bash
        run: |
          set -euo pipefail
          ./bin/omarchy --help >/dev/null
