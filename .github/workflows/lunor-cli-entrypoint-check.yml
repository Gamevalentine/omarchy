name: LUNOR CLI entrypoint check

on:
  push:
    branches:
      - lunor/1.0-branding
    paths:
      - .github/workflows/lunor-cli-entrypoint-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate LUNOR CLI entrypoint
        shell: bash
        run: |
          set -euo pipefail
          bash -n bin/lunor
          bash -n bin/omarchy
          test -x bin/omarchy

          # Run through bash so the check also works before executable-bit migration.
          help_output="$(bash bin/lunor --help)"
          printf '%s\n' "$help_output" | grep -Fq 'lunor <command> [args...]'
          printf '%s\n' "$help_output" | grep -Fq 'lunor commands'

          # The legacy router must still be present for compatibility in this small step.
          test -f bin/omarchy
          grep -Fq 'CLI_NAME="${LUNOR_CLI_NAME:-omarchy}"' bin/omarchy
