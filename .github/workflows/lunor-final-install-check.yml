name: LUNOR final install stage check

on:
  push:
    branches:
      - lunor/1.0-branding
    paths:
      - .github/workflows/lunor-final-install-check.yml

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Validate final install-stage migration
        shell: bash
        run: |
          set -euo pipefail

          scripts=(
            bin/lunor-install-docker-dbs
            bin/lunor-install-font
            bin/lunor-install-preinstalls
            bin/lunor-install-service-dropbox
            bin/lunor-install-service-nordvpn
            bin/lunor-install-service-once
            bin/lunor-install-service-sunshine
            bin/lunor-install-service-tailscale
          )

          for script in "${scripts[@]}"; do
            test -x "$script"
            bash -n "$script"
          done

          if grep -Eq 'OMARCHY_PATH|omarchy-(pkg|install|launch|cmd|refresh|font|system|webapp|plugin)' "${scripts[@]}"; then
            echo "Final install-stage canonical scripts still invoke migrated Omarchy dependencies directly" >&2
            exit 1
          fi

          grep -Fq 'lunor launch floating terminal with presentation' bin/lunor-install-font
          grep -Fq 'lunor refresh applications' bin/lunor-install-preinstalls
          grep -Fq 'lunor pkg add nordvpn-bin' bin/lunor-install-service-nordvpn
          grep -Fq 'lunor webapp install' bin/lunor-install-service-sunshine
          grep -Fq 'lunor plugin enable omarchy.tailscale' bin/lunor-install-service-tailscale

          ./bin/lunor commands --check
          ./test/cli

# rerun after NordVPN mock fix
