name: LUNOR toggle slice check

on:
  push:
    branches:
      - lunor/1.0-branding
    paths:
      - .github/workflows/lunor-toggle-slice-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate core and screensaver toggle migration
        shell: bash
        run: |
          set -euo pipefail

          for script in bin/lunor-toggle bin/lunor-toggle-screensaver; do
            test -x "$script"
            bash -n "$script"
          done

          ./bin/lunor commands --check

          ./bin/lunor commands --all --json |
            jq -e '
              [.commands[]
               | select(.binary == "lunor-toggle"
                     or .binary == "lunor-toggle-screensaver")]
              | length == 2
            ' >/dev/null

          ./bin/lunor toggle --help | grep -Fq 'lunor toggle <flag-name> [toggle|on|off]'
          ./bin/lunor toggle screensaver --help | grep -Fq 'lunor toggle screensaver'
          ./bin/omarchy toggle screensaver --help | grep -Fq 'omarchy toggle screensaver'

          tmp_home="$(mktemp -d)"
          tmp_bin="$(mktemp -d)"
          trap 'rm -rf "$tmp_home" "$tmp_bin"' EXIT

          HOME="$tmp_home" ./bin/lunor toggle demo on
          test -f "$tmp_home/.local/state/lunor/toggles/demo"
          HOME="$tmp_home" ./bin/lunor toggle demo off
          test ! -f "$tmp_home/.local/state/lunor/toggles/demo"
          HOME="$tmp_home" ./bin/lunor toggle demo
          test -f "$tmp_home/.local/state/lunor/toggles/demo"
          HOME="$tmp_home" ./bin/lunor toggle demo
          test ! -f "$tmp_home/.local/state/lunor/toggles/demo"

          cat >"$tmp_bin/lunor" <<'SH'
          #!/bin/bash
          printf '%s\n' "$*" >>"$LUNOR_TEST_LOG"
          case "$*" in
            'toggle enabled screensaver-off') exit 1 ;;
            *) exit 0 ;;
          esac
          SH
          chmod +x "$tmp_bin/lunor"

          LUNOR_TEST_LOG="$tmp_home/calls" PATH="$tmp_bin:$PATH" ./bin/lunor-toggle-screensaver
          grep -Fxq 'toggle screensaver-off' "$tmp_home/calls"
          grep -Fxq 'toggle enabled screensaver-off' "$tmp_home/calls"
          grep -Fq 'notification send' "$tmp_home/calls"
          grep -Fq 'Screensaver enabled' "$tmp_home/calls"
