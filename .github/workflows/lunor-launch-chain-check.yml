name: LUNOR launch chain check

on:
  push:
    branches:
      - lunor/1.0-branding
    paths:
      - .github/workflows/lunor-launch-chain-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4

      - name: Validate migrated launch chain
        shell: bash
        run: |
          set -euo pipefail

          for script in \
            bin/lunor-launch-about \
            bin/lunor-launch-screensaver \
            bin/lunor-screensaver \
            bin/lunor-launch-or-focus \
            bin/lunor-launch-tui \
            bin/lunor-launch-or-focus-tui; do
            test -x "$script"
            bash -n "$script"
          done

          ./bin/lunor commands --check

          migrated_count="$(
            ./bin/lunor commands --all --json |
              jq '[.commands[]
                | select(.binary == "lunor-launch-about"
                      or .binary == "lunor-launch-screensaver"
                      or .binary == "lunor-launch-or-focus-tui"
                      or .binary == "lunor-launch-tui"
                      or .binary == "lunor-launch-or-focus"
                      or .binary == "lunor-screensaver")] | length'
          )"
          test "$migrated_count" -eq 6

          ./test/shell.d/launch-about-test.sh
          bash ./test/shell.d/screensaver-workspace-test.sh

          ./bin/lunor launch about --help | grep -Fq 'lunor launch about'
          ./bin/omarchy launch about --help | grep -Fq 'omarchy launch about'
