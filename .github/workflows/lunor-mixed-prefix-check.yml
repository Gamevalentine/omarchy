name: LUNOR mixed command prefix check

on:
  push:
    branches:
      - lunor/1.0-branding
    paths:
      - .github/workflows/lunor-mixed-prefix-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate gradual command migration
        shell: bash
        run: |
          set -euo pipefail

          bash -n bin/lunor
          bash -n bin/omarchy
          bash -n bin/lunor-branding-about
          bash -n bin/lunor-branding-about-animation
          bash -n bin/lunor-branding-screensaver

          test -x bin/lunor
          test -x bin/omarchy
          test -x bin/lunor-branding-about
          test -x bin/lunor-branding-about-animation
          test -x bin/lunor-branding-screensaver

          ./bin/lunor commands --check

          ./bin/lunor commands --all --json |
            jq -e '.commands[] | select(.binary == "lunor-branding-about" and .route == "lunor branding about")' >/dev/null

          ./bin/lunor commands --json |
            jq -e '.commands[] | select(.binary == "omarchy-pkg-add" and .route == "lunor pkg add")' >/dev/null

          help_output="$(./bin/lunor branding about --help)"
          printf '%s\n' "$help_output" | grep -Fq 'lunor branding about <image|text|reset>'

          legacy_help="$(./bin/omarchy branding about --help)"
          printf '%s\n' "$legacy_help" | grep -Fq 'omarchy branding about <image|text|reset>'
