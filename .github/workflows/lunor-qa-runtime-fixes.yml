name: LUNOR QA runtime fixes

permissions:
  contents: write

on:
  push:
    branches:
      - lunor/1.0-clean-branding
    paths:
      - .github/workflows/lunor-qa-runtime-fixes.yml

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: lunor/1.0-clean-branding

      - name: Apply user-visible branding fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          replacements = {
              "install/user/first-run/install-voxtype.hook": [
                  ("Click to install voice dictation for Omarchy.", "Click to install voice dictation for LUNOR OS."),
              ],
              "install/user/first-run/setup-agent.hook": [
                  ("# Omarchy ships no default agent, so invite once rather than picking one.",
                   "# LUNOR OS ships no default agent, so invite once rather than picking one."),
                  ("Let your favorite agent help with Omarchy.", "Let your favorite agent help with LUNOR OS."),
              ],
              "shell/plugins/agents/Panel.qml": [
                  ("Make me a new Omarchy theme.", "Make me a new LUNOR OS theme."),
                  ("following the Omarchy skill's theming guide", "following the installed theming guide"),
                  ("Make me a new Omarchy shell plugin.", "Make me a new LUNOR OS shell plugin."),
                  ("following the Omarchy skill's plugin guide", "following the installed plugin guide"),
                  ("Make me a new app for my Omarchy desktop.", "Make me a new app for my LUNOR OS desktop."),
              ],
              "shell/plugins/dev-gallery/GalleryPanel.qml": [
                  ("Omarchy shell – dev gallery", "LUNOR OS shell – dev gallery"),
                  ("Omarchy shell · dev gallery", "LUNOR OS shell · dev gallery"),
                  ('label: "Omarchy menu"', 'label: "LUNOR OS menu"'),
              ],
              "shell/plugins/bar/widgets/SystemUpdate.manifest.json": [
                  ("Indicates available Omarchy updates", "Indicates available LUNOR OS updates"),
              ],
          }

          for name, reps in replacements.items():
              path = Path(name)
              text = path.read_text()
              for old, new in reps:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {name}: {old}")
                  text = text.replace(old, new)
              path.write_text(text)

          for path in Path("shell/plugins").rglob("manifest.json"):
              text = path.read_text()
              if '"author": "Omarchy"' in text:
                  text = text.replace('"author": "Omarchy"', '"author": "Upstream Omarchy"')
                  path.write_text(text)
          PY

          git diff --check
          git diff --stat

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LUNOR QA"
          git config user.email "actions@users.noreply.github.com"
          git add install/user/first-run shell/plugins
          git diff --cached --quiet && exit 0
          git commit -m "LUNOR: fix remaining visible desktop branding"
          git push origin HEAD:lunor/1.0-clean-branding
