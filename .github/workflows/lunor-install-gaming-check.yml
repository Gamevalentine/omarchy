name: LUNOR install gaming stage check

on:
  push:
    branches:
      - lunor/1.0-branding
    paths:
      - .github/workflows/lunor-install-gaming-check.yml

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Validate install gaming-stage migration
        shell: bash
        run: |
          set -euo pipefail

          scripts=(
            bin/lunor-install-gaming-battlenet
            bin/lunor-install-gaming-geforce-now
            bin/lunor-install-gaming-gpu-lib32
            bin/lunor-install-gaming-heroic
            bin/lunor-install-gaming-lutris
            bin/lunor-install-gaming-retroarch
            bin/lunor-install-gaming-steam
            bin/lunor-install-gaming-xbox-cloud
            bin/lunor-install-gaming-xbox-controllers
          )

          for script in "${scripts[@]}"; do
            test -x "$script"
            bash -n "$script"
          done

          if grep -Eq 'OMARCHY_PATH|omarchy-(pkg|install|launch|hw|webapp)' "${scripts[@]}"; then
            echo "Install gaming-stage canonical scripts still invoke migrated Omarchy dependencies directly" >&2
            exit 1
          fi

          grep -Fq 'lunor install gaming gpu-lib32' bin/lunor-install-gaming-steam
          grep -Fq 'lunor hw nvidia gsp' bin/lunor-install-gaming-gpu-lib32
          grep -Fq 'lunor webapp install "Xbox Cloud Gaming"' bin/lunor-install-gaming-xbox-cloud
          grep -Fq 'lunor pkg add xpadneo-dkms' bin/lunor-install-gaming-xbox-controllers

          ./bin/lunor commands --check
          ./test/cli

# rerun after RetroArch assertion fix
