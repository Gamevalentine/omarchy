name: LUNOR stage 4 validation

on:
  push:
    branches:
      - lunor/1.0-clean-branding
    paths:
      - .github/workflows/lunor-stage4-validation.yml

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate setup branding
        shell: bash
        run: |
          set -euo pipefail
          bash -n install/provisioning/setup-form.sh
          bash -n bin/omarchy-provision-owner
          bash -n bin/omarchy-provision-first-run
          bash -n bin/omarchy-provision-user
          bash test/shell.d/setup-form-test.sh
          grep -Fq "OMARCHY_HOSTNAME_DEFAULT='lunor'" install/provisioning/setup-form.sh
          grep -Fq "return for 'lunor'" install/provisioning/setup-form.sh
          grep -Fq "Name=LUNOR OS (Hyprland uwsm)" default/wayland-sessions/omarchy.desktop
          grep -Fq "Description=LUNOR OS provisioning first-boot user setup" install/provisioning/omarchy-provision-owner.service
          grep -Fq "Description=LUNOR OS factory reset wipe" install/provisioning/omarchy-system-factory-reset-finish.service
          grep -Fq "Welcome to LUNOR OS" bin/omarchy-provision-owner
          grep -Fq "LUNOR OS menu" bin/omarchy-provision-owner
