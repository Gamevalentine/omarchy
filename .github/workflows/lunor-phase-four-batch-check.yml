name: LUNOR phase four batch check

on:
  push:
    branches:
      - lunor/1.0-branding
    paths:
      - .github/workflows/lunor-phase-four-batch-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate phase four command batch
        shell: bash
        run: |
          set -euo pipefail

          scripts=(
            bin/lunor-notification-battery
            bin/lunor-notification-dismiss
            bin/lunor-notification-time
            bin/lunor-notification-wait
            bin/lunor-notification-weather
            bin/lunor-restart-app
            bin/lunor-restart-btop
            bin/lunor-restart-gum
            bin/lunor-restart-helix
            bin/lunor-restart-herdr
            bin/lunor-restart-hyprctl
            bin/lunor-restart-hyprsunset
            bin/lunor-restart-opencode
            bin/lunor-restart-terminal
            bin/lunor-restart-tmux
            bin/lunor-launch-config-editor
            bin/lunor-launch-discord-community
            bin/lunor-launch-editor
            bin/lunor-launch-nautilus
            bin/lunor-launch-nautilus-cwd
            bin/lunor-launch-terminal
            bin/lunor-launch-terminal-tmux
            bin/lunor-launch-terminal-herdr
            bin/lunor-launch-webapp
            bin/lunor-launch-or-focus-webapp
          )

          for script in "${scripts[@]}"; do
            test -x "$script"
            bash -n "$script"
            if grep -Eq 'omarchy-[a-z0-9-]+' "$script"; then
              echo "$script still calls or exposes a legacy Omarchy binary directly" >&2
              exit 1
            fi
          done

          bash -n test/cli
          ./bin/lunor commands --check
          ./test/cli
