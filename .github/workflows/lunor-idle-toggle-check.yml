name: LUNOR idle toggle check

on:
  push:
    branches:
      - lunor/1.0-branding
    paths:
      - .github/workflows/lunor-idle-toggle-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate idle toggle migration
        shell: bash
        run: |
          set -euo pipefail

          test -x bin/lunor-toggle-idle
          bash -n bin/lunor-toggle-idle
          ./bin/lunor commands --check

          ./bin/lunor commands --all --json |
            jq -e '
              .commands[]
              | select(.binary == "lunor-toggle-idle"
                    and .route == "lunor toggle idle"
                    and .filename_route == "lunor toggle idle")
            ' >/dev/null

          ./bin/lunor toggle idle --help |
            grep -Fq 'lunor toggle idle [toggle|stay-awake|allow-idle|status]'

          ./bin/omarchy toggle idle --help |
            grep -Fq 'omarchy toggle idle [toggle|stay-awake|allow-idle|status]'

          tmp_home="$(mktemp -d)"
          trap 'rm -rf "$tmp_home"' EXIT

          test "$(HOME="$tmp_home" ./bin/lunor toggle idle --status)" = '{"enabled":false,"class":"disabled","tooltip":"Stay Awake"}'
          test "$(HOME="$tmp_home" ./bin/lunor toggle idle stay-awake)" = "disabled"
          test -f "$tmp_home/.local/state/lunor/indicators/stay-awake"
          test "$(HOME="$tmp_home" ./bin/lunor toggle idle status)" = '{"enabled":true,"class":"enabled","tooltip":"Allow Idle Lock & Screensaver"}'
          test "$(HOME="$tmp_home" ./bin/lunor toggle idle allow-idle)" = "enabled"
          test ! -f "$tmp_home/.local/state/lunor/indicators/stay-awake"
