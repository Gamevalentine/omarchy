name: LUNOR install AI stage check

on:
  push:
    branches:
      - lunor/1.0-branding
    paths:
      - .github/workflows/lunor-install-ai-check.yml

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Validate install AI-stage migration
        shell: bash
        run: |
          set -euo pipefail

          scripts=(
            bin/lunor-install-ai-chatgpt
            bin/lunor-install-ai-claude
            bin/lunor-install-ai-hermes
            bin/lunor-install-ai-openclaw
            bin/lunor-install-ai-t3-code
            bin/lunor-install-hermes-cli
            bin/lunor-install-openclaw-cli
          )

          for script in "${scripts[@]}"; do
            test -x "$script"
            bash -n "$script"
          done

          grep -Fq 'lunor pkg add openai-codex-desktop' bin/lunor-install-ai-chatgpt
          grep -Fq 'lunor pkg add claude-desktop' bin/lunor-install-ai-claude
          grep -Fq 'lunor install hermes cli --now' bin/lunor-install-ai-hermes
          grep -Fq 'lunor install openclaw cli --now' bin/lunor-install-ai-openclaw
          grep -Fq '"lunor launch openclaw"' bin/lunor-install-ai-openclaw
          grep -Fq 'lunor pkg add t3code-bin' bin/lunor-install-ai-t3-code
          grep -Fq 'lunor pkg present hermes-desktop' bin/lunor-install-hermes-cli
          grep -Fq 'lunor pkg present openclaw' bin/lunor-install-openclaw-cli

          ./bin/lunor commands --check
          ./test/cli

# rerun after AI CLI expectation update
