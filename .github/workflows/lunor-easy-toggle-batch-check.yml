name: LUNOR easy toggle batch check

on:
  push:
    branches:
      - lunor/1.0-branding
    paths:
      - .github/workflows/lunor-easy-toggle-batch-check.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate easy toggle batch
        shell: bash
        run: |
          set -euo pipefail

          for script in \
            bin/lunor-toggle-bar \
            bin/lunor-toggle-nightlight \
            bin/lunor-toggle-notification-silencing \
            bin/lunor-toggle-touchpad \
            bin/lunor-toggle-touchscreen; do
            test -x "$script"
            bash -n "$script"
          done

          bash -n test/cli
          ./bin/lunor commands --check

          ./bin/lunor commands --all --json |
            jq -e '
              [.commands[]
               | select(.binary == "lunor-toggle-bar"
                     or .binary == "lunor-toggle-nightlight"
                     or .binary == "lunor-toggle-notification-silencing"
                     or .binary == "lunor-toggle-touchpad"
                     or .binary == "lunor-toggle-touchscreen")]
              | length == 5
            ' >/dev/null

          ./bin/lunor toggle bar --help | grep -Fq 'lunor toggle bar [toggle|on|off]'
          ./bin/lunor toggle nightlight --help | grep -Fq 'lunor toggle nightlight [--status]'
          ./bin/lunor toggle notification silencing --help | grep -Fq 'lunor toggle notification silencing'
          ./bin/lunor toggle touchpad --help | grep -Fq 'lunor toggle touchpad [on|off|toggle]'
          ./bin/lunor toggle touchscreen --help | grep -Fq 'lunor toggle touchscreen [on|off|toggle]'

          for script in \
            bin/lunor-toggle-bar \
            bin/lunor-toggle-nightlight \
            bin/lunor-toggle-notification-silencing \
            bin/lunor-toggle-touchpad \
            bin/lunor-toggle-touchscreen; do
            if grep -Eq 'omarchy-(toggle|shell)' "$script"; then
              echo "$script still calls a legacy Omarchy toggle/shell binary" >&2
              exit 1
            fi
          done

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          cat >"$tmp/lunor" <<'SH'
          #!/bin/bash
          printf '%s\n' "$*" >>"$LUNOR_TEST_LOG"
          exit 0
          SH
          chmod +x "$tmp/lunor"

          bar_log="$tmp/bar.log"
          LUNOR_TEST_LOG="$bar_log" PATH="$tmp:$PATH" ./bin/lunor-toggle-bar off
          grep -Fxq 'toggle bar-off off' "$bar_log"
          grep -Fxq 'shell -q omarchy.bar syncHidden' "$bar_log"

          notify_log="$tmp/notify.log"
          LUNOR_TEST_LOG="$notify_log" PATH="$tmp:$PATH" ./bin/lunor-toggle-notification-silencing
          grep -Fxq 'shell notifications toggleDnd' "$notify_log"
          grep -Fxq 'shell -q omarchy.indicators refresh' "$notify_log"

          touch_log="$tmp/touch.log"
          LUNOR_TEST_LOG="$touch_log" PATH="$tmp:$PATH" ./bin/lunor-toggle-touchpad off
          grep -Fxq 'toggle input device touchpad off' "$touch_log"
          : >"$touch_log"
          LUNOR_TEST_LOG="$touch_log" PATH="$tmp:$PATH" ./bin/lunor-toggle-touchscreen on
          grep -Fxq 'toggle input device touchscreen on' "$touch_log"

          cat >"$tmp/pgrep" <<'SH'
          #!/bin/bash
          exit 0
          SH
          cat >"$tmp/sleep" <<'SH'
          #!/bin/bash
          exit 0
          SH
          cat >"$tmp/hyprctl" <<'SH'
          #!/bin/bash
          state="${NIGHTLIGHT_STATE:?}"
          if [[ $* == "hyprsunset temperature" ]]; then
            printf 'Temperature: %sK\n' "$(cat "$state")"
            exit 0
          fi
          if [[ $1 == "hyprsunset" && $2 == "temperature" && -n ${3:-} ]]; then
            printf '%s\n' "$3" >"$state"
            exit 0
          fi
          exit 1
          SH
          chmod +x "$tmp/pgrep" "$tmp/sleep" "$tmp/hyprctl"

          printf '6500\n' >"$tmp/temp"
          night_log="$tmp/night.log"
          LUNOR_TEST_LOG="$night_log" NIGHTLIGHT_STATE="$tmp/temp" PATH="$tmp:$PATH" ./bin/lunor-toggle-nightlight
          test "$(cat "$tmp/temp")" = "4000"
          grep -Fxq 'shell -q nightlight refresh' "$night_log"

          NIGHTLIGHT_STATE="$tmp/temp" PATH="$tmp:$PATH" ./bin/lunor-toggle-nightlight --status |
            jq -e '.enabled == true and .temperature == 4000' >/dev/null

          ./bin/omarchy toggle bar --help | grep -Fq 'omarchy toggle bar [toggle|on|off]'
          ./bin/omarchy toggle nightlight --help | grep -Fq 'omarchy toggle nightlight [--status]'

# validation rerun after test repair
